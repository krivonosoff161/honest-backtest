name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - name: Check out validator
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: python -m ruff check .
      - name: Documentation contract
        run: python scripts/check_portfolio_docs.py
      - name: Run tests
        run: python -m pytest -q

  upstream-projection:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validator
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python 3.11
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Check out canonical public roadmap
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: krivonosoff161/trading-bot-v2
          ref: main
          path: upstream-trading-bot-v2
          persist-credentials: false
      - name: Verify pinned upstream roadmap identity
        run: >-
          python scripts/check_portfolio_docs.py
          --upstream-roadmap upstream-trading-bot-v2/docs/trading-portfolio-roadmap.yaml
